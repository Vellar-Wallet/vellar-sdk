name: "Check Documented URLs"
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run URL Checker
        run: node contrib/issue-507/url-checker.mjs