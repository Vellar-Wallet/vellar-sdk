name: CI

on:
  push:
    branches: [main, drips]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Security audit V-8. Blocking at `high` matches the sibling repos. Fixes
      # are lockfile-only by policy: anything needing a `package.json` range
      # change is reported and decided, not forced through by CI.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      # Docs snippets typecheck against the current source — a quickstart that
      # drifts from the real API fails the PR that introduces the drift.
      - run: npm run check:docs
      - run: npm test
      - run: npm run build

  # OPTIONAL load test job — measures concurrent payment-submission latency and
  # error rate at increasing concurrency. Deliberately NOT run on every
  # push/PR (it is slower and load-timing sensitive); trigger it manually with
  # the "Run workflow" button (workflow_dispatch). See CONTRIBUTING.md.
  load-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:load
