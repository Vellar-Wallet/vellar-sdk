name: CI

on:
  push:
    branches: [main, drips]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Security audit V-8: Automated dependency scanning in CI.
      # Fails the build on high or critical severity findings.
      # Documented exception process is in docs/dependency-exceptions.md.
      - name: Dependency vulnerability scan
        run: npm run audit
      - run: npm run typecheck
      # Docs snippets typecheck against the current source — a quickstart that
      # drifts from the real API fails the PR that introduces the drift.
      - run: npm run check:docs
      - run: npm test
      - run: npm run build
