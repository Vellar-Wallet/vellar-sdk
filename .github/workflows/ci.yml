name: CI

on:
  push:
    branches: [main, drips]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:api
      - run: npm ci
        working-directory: examples
      - run: npm run typecheck
        working-directory: examples
      - run: npm run build
        working-directory: examples
