name: CI

on:
  push:
    branches: [main, drips]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Security audit V-8. Fixes are lockfile-only by policy: anything needing
      # a `package.json` range change is reported and decided, not forced
      # through by CI.
      #
      # The gate was softened from --audit-level=high to --audit-level=critical
      # on 2026-09-07, which also started admitting any NEW high anywhere in the
      # tree. It is now a named allowlist instead: every high must be fixed or
      # be one of three specific advisories in the known chain, and anything
      # else fails the build.
      #
      #   passkey-kit → @openzeppelin/relayer-plugin-channels →
      #   @stellar/stellar-sdk (≤15.x) → toml / smol-toml
      #
      # A major-version override is unsafe inside the passkey signing path, so
      # the chain is allowlisted rather than overridden.
      # Tracked: https://github.com/Vellar-Wallet/vellar-sdk/issues/378
      # REVIEW CHECKPOINT: 2026-12-15 — the allowlist expires on that date, and
      # the gate then fails until the advisories are re-checked. See
      # scripts/audit-gate.mjs.
      - run: node scripts/audit-gate.mjs
      - run: npm run typecheck
      # Docs snippets typecheck against the current source — a quickstart that
      # drifts from the real API fails the PR that introduces the drift.
      - run: npm run check:docs
      - run: npm test
      - run: npm run build

  # OPTIONAL load test job — measures concurrent payment-submission latency and
  # error rate at increasing concurrency. Deliberately NOT run on every
  # push/PR (it is slower and load-timing sensitive); trigger it manually with
  # the "Run workflow" button (workflow_dispatch). See CONTRIBUTING.md.
  load-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:load
