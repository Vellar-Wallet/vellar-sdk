name: CI

on:
  push:
    branches: [main, drips]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Security audit V-8. Fixes are lockfile-only by policy: anything needing
      # a `package.json` range change is reported and decided, not forced
      # through by CI.
      #
      # Gate softened from --audit-level=high to --audit-level=critical on
      # 2026-09-07. Remaining highs are in the toml chain via passkey-kit →
      # @openzeppelin/relayer-plugin-channels → @stellar/stellar-sdk ≤15.x — a
      # major-version override (passkey-kit@0.19.1) is outside the declared
      # peer range and was assessed, not just deferred: the vulnerable toml
      # parser is only reachable via `passkey-kit/server`'s relayer module,
      # which this SDK never imports (see docs/security-audit.md V-8).
      # Tracked: https://github.com/Vellar-Wallet/vellar-sdk/issues/390
      # Restore to --audit-level=high when passkey-kit resolves upstream.
      - run: npm audit --audit-level=critical
      - run: npm run typecheck
      # Issue #389: TESTNET.walletWasmHash must match the WASM the INSTALLED
      # passkey-kit version actually deploys, or wallet creation fails (wrong
      # hash) or silently targets a superseded, previously-vulnerable contract
      # (stale hash — this check's first run caught exactly that). Nothing else
      # ties the configured hash to a passkey-kit bump.
      - run: npm run verify:wasm-hash
      # Docs snippets typecheck against the current source — a quickstart that
      # drifts from the real API fails the PR that introduces the drift.
      - run: npm run check:docs
      - run: npm test
      - run: npm run build

  # OPTIONAL load test job — measures concurrent payment-submission latency and
  # error rate at increasing concurrency. Deliberately NOT run on every
  # push/PR (it is slower and load-timing sensitive); trigger it manually with
  # the "Run workflow" button (workflow_dispatch). See CONTRIBUTING.md.
  load-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:load
