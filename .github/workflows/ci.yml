name: CI

on:
  push:
    branches: [main, drips]
  pull_request:
  workflow_dispatch:

jobs:
  check-ai-attribution:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for AI attribution in PR commits
        run: |
          # Get the merge base to identify PR commits only
          merge_base=$(git merge-base origin/dev HEAD)

          # Get all commits in the PR (excluding existing history)
          commits=$(git rev-list ${merge_base}..HEAD)

          # Check each commit message for AI attribution
          for commit in $commits; do
            commit_msg=$(git log -1 --format=%B "$commit")
            
            if echo "$commit_msg" | grep -iE "Co-Authored-By:.*\b(claude|gpt|chatgpt|gemini|copilot|deepseek|llama|mistral|AI|artificial intelligence)" >/dev/null 2>&1; then
              echo "Error: Commit $commit contains AI attribution in Co-Authored-By trailer."
              exit 1
            fi
            
            if echo "$commit_msg" | grep -iE "(Generated with|Assisted by|Created by).*\b(AI|Claude|GPT|ChatGPT|Gemini|Copilot)" >/dev/null 2>&1; then
              echo "Error: Commit $commit contains AI attribution phrase."
              exit 1
            fi
          done

          echo "✓ No AI attribution found in PR commits"

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Security audit V-8. Fixes are lockfile-only by policy: anything needing
      # a `package.json` range change is reported and decided, not forced
      # through by CI.
      #
      # Gate softened from --audit-level=high to --audit-level=critical on
      # 2026-09-07. Remaining highs are in the toml chain via passkey-kit →
      # @openzeppelin/relayer-plugin-channels → @stellar/stellar-sdk ≤15.x — a
      # major-version override is unsafe inside the passkey signing path.
      # Tracked: https://github.com/Vellar-Wallet/vellar-sdk/issues/378
      # Restore to --audit-level=high when upstream resolves.
      - run: npm audit --audit-level=critical
      - run: npm run typecheck
      # Docs snippets typecheck against the current source — a quickstart that
      # drifts from the real API fails the PR that introduces the drift.
      - run: npm run check:docs
      - run: npm test
      - run: npm run build

  # OPTIONAL load test job — measures concurrent payment-submission latency and
  # error rate at increasing concurrency. Deliberately NOT run on every
  # push/PR (it is slower and load-timing sensitive); trigger it manually with
  # the "Run workflow" button (workflow_dispatch). See CONTRIBUTING.md.
  load-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:load
