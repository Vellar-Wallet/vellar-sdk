name: Publish

# Publishing runs ONLY from a tag, only from CI, and only after the same gates
# that guard a pull request. Security audit V-8: a compromised publish executes
# in every consumer's browser and inside an MCP server holding a signing key, so
# the artifact must be attributable to a specific commit and workflow.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: mints the OIDC token npm exchanges for a
      # signed attestation binding the tarball to this workflow and commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Fail loudly if the tag and the package version disagree, rather than
      # publishing something whose provenance points at the wrong commit.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
