# Hosted-service keepalive.
#
# The free Render instances this workflow was written for (vellar-backend,
# vellar-facilitator, vellar-seller-demo on *.onrender.com) are all suspended
# and return HTTP 503. Every URL below now points at the Railway deployment
# that replaced it.
#
# Measured 2026-09-30, warm, against the Railway hosts:
#   backend /health          200 in ~1.2s
#   facilitator /health      200 in ~1.2s
#   seller demo /quote       402 in ~1.2s  (402 IS the correct answer — it is a
#                                               paid route refusing an unpaid GET)
#   explorer /health         200 in ~1.2s
# No idle-sleep was observed across repeated calls, and the ~89s/~32s wake
# figures in the old header belonged to the Render free tier, which no longer
# serves these services. A cold-start time for Railway has NOT been measured —
# do not quote a wake figure this file does not have.
#
# Because the hosts answer fast and the workflow is still cheap, it stays
# available on demand rather than running on a schedule. Uncomment the
# `schedule:` block below to enable the 10-minute cadence; leave it off if you
# are not warming anything ahead of an event.
#
# The run DOES fail when a service is not healthy. The previous version could
# not: it swallowed every result, so a suspended host printed 503s in the log
# and the workflow still went green. Slowness is tolerated (a slow response is
# what a keepalive is for); a non-healthy status is not.

name: Hackathon keepalive

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping hosted services
        # 402 counts as healthy: it is the documented response from a paid
        # route, not an outage. Everything else must be 2xx.
        run: |
          failed=0
          while read -r url; do
            [ -z "$url" ] && continue
            result=$(curl -s -o /dev/null -m 120 -w "%{http_code} in %{time_total}s" "$url" || echo "unreachable")
            code=${result%% *}
            echo "$url -> $result"
            case "$code" in
              2*|402) ;;
              *)
                echo "::error::$url is not healthy (HTTP ${code:-none})"
                failed=1
                ;;
            esac
          done <<'EOF'
          https://vellar-backend-production.up.railway.app/health
          https://vellar-facilitator-production.up.railway.app/health
          https://vellar-seller-demo-production.up.railway.app/quote
          https://vellar-explorer-production.up.railway.app/health
          EOF
          exit "$failed"
